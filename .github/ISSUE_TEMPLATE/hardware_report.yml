name: Hardware report
description: Tell us how Stambha runs on your machine. These build the compatibility list.
labels: ["hardware report"]
title: "[Hardware] "
body:
  - type: markdown
    attributes:
      value: Title it with the machine, e.g. "[Hardware] Lenovo Legion 5 Pro (2023)". Reports that something works are just as useful as reports that it doesn't.
  - type: dropdown
    id: kind
    attributes:
      label: Desktop or laptop?
      options: [Desktop, Laptop]
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Wi-Fi / Ethernet chips
  - type: input
    id: version
    attributes:
      label: Stambha version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Installs
        - label: Boots to the desktop
        - label: Graphics acceleration
        - label: Network in macOS (Ethernet or Wi-Fi)
        - label: Audio
        - label: Keyboard and touchpad / mouse
        - label: Bluetooth
        - label: Battery level (laptops)
        - label: Sleep / lid (laptops)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that doesn't work, and anything you had to do to make it work.
